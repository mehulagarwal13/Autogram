<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Autogram</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="logo">Autogram</span>
    <button id="settings-btn" title="Settings">⚙</button>
  </header>

  <section id="login-view" class="view hidden">
    <p class="hint">Sign in with your Autogram account.</p>
    <input id="login-email" type="email" placeholder="Email" />
    <input id="login-password" type="password" placeholder="Password" />
    <button id="login-btn" class="primary">Sign In</button>
    <p id="login-error" class="error hidden"></p>
  </section>

  <section id="main-view" class="view hidden">
    <p class="hint">Signed in as <span id="account-email"></span> · <a href="#" id="logout-link">Sign out</a></p>

    <label class="toggle">
      <input type="checkbox" id="autopilot-toggle" disabled />
      Autopilot (coming soon — v1 is copilot only)
    </label>

    <button id="fill-btn" class="primary">Fill This Application</button>

    <div id="progress" class="hidden">
      <div class="spinner"></div>
      <p id="progress-text"></p>
    </div>

    <div id="result" class="hidden">
      <p id="result-text"></p>
      <a id="result-link" class="primary" href="#" target="_blank">Open in Dashboard</a>
    </div>

    <p id="main-error" class="error hidden"></p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
