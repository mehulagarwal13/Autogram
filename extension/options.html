<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Autogram — Settings</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0b0f1a; color: #e2e8f0; padding: 20px; max-width: 420px; }
    h1 { font-size: 16px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-top: 12px; }
    input { width: 100%; padding: 8px; margin-top: 4px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #e2e8f0; }
    button { margin-top: 16px; padding: 8px 14px; border: none; border-radius: 6px; background: linear-gradient(90deg, #6366f1, #d946ef); color: white; font-weight: 600; cursor: pointer; }
    p.saved { color: #34d399; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Autogram — Extension Settings</h1>
  <p style="font-size:12px;color:#94a3b8;">Where your Autogram backend and web dashboard are running. Defaults match the local dev setup.</p>

  <label for="backend-url">Backend API URL</label>
  <input id="backend-url" type="url" placeholder="http://127.0.0.1:8000" />

  <label for="frontend-url">Web dashboard URL</label>
  <input id="frontend-url" type="url" placeholder="http://localhost:5173" />

  <button id="save-btn">Save</button>
  <p id="saved-msg" class="saved" style="display:none;">Saved.</p>

  <script src="options.js"></script>
</body>
</html>
