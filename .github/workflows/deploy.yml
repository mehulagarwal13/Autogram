name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # alembic/ is the source of truth for schema changes - app/main.py's own
      # bootstrap only creates missing tables on first run, it never applies
      # alterations (see README.md). Every deploy applies pending migrations
      # to Neon before the new container image goes live.
      - name: Apply database migrations
        # Runs inside backend/: that is where alembic.ini, the versions/ tree,
        # and the `app` package alembic/env.py imports all live after the
        # backend/ + frontend/ split.
        working-directory: backend
        run: |
          pip install --no-cache-dir -r requirements.txt
          alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Builds the container image (Docker, on this runner - never on your
      # machine) from the root Dockerfile, and publishes both the container
      # and the built frontend/dist assets behind the one Worker defined in
      # worker/wrangler.toml.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
