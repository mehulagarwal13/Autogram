name: Deploy backend to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "worker/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: production-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-migrate.txt

      - name: Apply database migrations
        working-directory: backend
        run: |
          pip install --disable-pip-version-check -r requirements-migrate.txt
          alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Runtime validation happens while Alembic imports model metadata.
          # Only DATABASE_URL is actually used by migrations.
          OPENAI_API_KEY: migration-not-used
          ADZUNA_APP_ID: migration-not-used
          ADZUNA_APP_KEY: migration-not-used
          JWT_SECRET: migration-not-used
          ENCRYPTION_KEY: migration-not-used

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install backend deploy adapter
        working-directory: worker
        run: npm ci

      - name: Deploy backend Worker and Container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
