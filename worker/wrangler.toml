# Cloudflare deployment config for Autogram.
#
# Backend-only Worker and Cloudflare Container. The frontend is a separate
# Cloudflare Pages project and calls this service through VITE_API_URL.
name = "autogram-api"
main = "index.js"
compatibility_date = "2026-08-01"

[[containers]]
class_name = "Backend"
image = "../backend/Dockerfile"
# Hard architectural requirement, not a cost knob: the backend keeps
# automation task state, open review-session browsers, and WebSocket
# subscribers in this ONE process's memory (see backend/Dockerfile's CMD
# comment, and README.md's "SINGLE WORKER ONLY" section). A second instance
# would silently drop requests routed to an instance that doesn't own a
# given task, session, or socket.
max_instances = 1

[[durable_objects.bindings]]
name = "BACKEND"
class_name = "Backend"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Backend"]

# Non-secret config passed into the container as plain env vars. Everything
# sensitive (DATABASE_URL, OPENAI_API_KEY, JWT_SECRET, ENCRYPTION_KEY,
# ADZUNA_APP_ID, ADZUNA_APP_KEY, API_KEY) is set with
# `npx wrangler secret put <NAME>` instead - see ../DEPLOYMENT.md - and read
# automatically via the `env` import in index.js. CORS_ORIGINS and optional
# CORS_ORIGIN_REGEX are environment-specific Worker secrets as well.
[vars]
AUTOMATION_BROWSER_MODE = "launch"
AUTOMATION_HEADLESS = "true"
# Local container disk preserves current behavior but is ephemeral. See
# DEPLOYMENT.md before changing this to "s3" for Cloudflare R2.
STORAGE_BACKEND = "local"
