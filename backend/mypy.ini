# Type checking for Autogram — scoped deliberately.
#
# Running mypy across the whole repository today reports ~100 pre-existing
# findings, almost all of one shape: a config value typed `str | None` (because
# `os.getenv` returns that) passed to something requiring `str`. They are real
# in principle, but every one of them is on a path that has been exercised by
# 1200 passing tests and a real-browser E2E suite, so the practical failure rate
# is zero and "fixing" them means threading asserts through working code.
#
# So this config does what §21 of the brief asks: enforce on the NEW and
# CRITICAL workflow modules, and leave the legacy tree alone until someone
# chooses to take it on deliberately.
#
# `follow_imports = silent` is what makes that possible — the listed modules are
# type-checked properly, but errors inside their (unchecked) dependencies are
# not reported. Without it, checking one clean file surfaces every finding in
# everything it transitively imports.
#
# Run:  mypy --config-file mypy.ini

[mypy]
python_version = 3.10
follow_imports = silent
ignore_missing_imports = True
# The critical workflow surface: recovery, the event bus, the chat transcript,
# and the chat/stream API. These are the modules where a type error would show
# up as a mid-application failure rather than a startup crash.
files =
    app/services/automation_recovery.py,
    app/services/event_bus.py,
    app/services/chat_repository.py,
    app/api/chat.py

# Not strict mode. `disallow_untyped_defs` would demand annotations on every
# helper in these files including the test-facing ones, which is a bigger change
# than the value it returns right now. These two catch the mistakes that
# actually happen: an unreachable branch, and an ignore comment that has
# outlived the error it silenced.
warn_unused_ignores = True
warn_unreachable = True
