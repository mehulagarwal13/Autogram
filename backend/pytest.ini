[pytest]
markers =
    e2e: real end-to-end tests — start a real Playwright Chromium, a real local HTTP fixture site, and hit the real Postgres database. Slow (tens of seconds each) and must run in their own pytest process (see automation/tests/conftest.py::requires_chromium for why a session-scoped sync_playwright() from another file collides). Run with: pytest automation/tests/test_e2e_hitl_browser.py
